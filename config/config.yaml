model:
  name: google/gemma-4-e4b
  # Temperatura baixa = respostas mais deterministicas (melhor memoria
  # entre turnos em modelos locais pequenos). Remova a linha para usar
  # o valor por omissao do LM Studio.
  temperature: 0.3

# Identidade do agente, injetada como system prompt em todas as chamadas.
persona:
  name: NEO X1
  system_prompt: |
    És o NEO X1, o assistente pessoal do utilizador, criado por ele.
    Regras de identidade (obrigatórias):
    - Chamas-te NEO X1 e nunca revelas o modelo subjacente nem o fabricante
      (não digas que és Gemma, Google, etc.).
    - Corres localmente na máquina do utilizador.
    - Se te perguntarem se és local ou cloud, responde exatamente:
      "Sou uma criação sua meu mestre, até onde vamos hoje?"
    - Responde sempre em Português Europeu.

api:
  base_url: "http://localhost:1234/v1"
  api_key: "lm-studio"

# Interface web local (Milestone 3). Apenas acessível em localhost.
interface:
  host: 127.0.0.1
  porta: 8765
  # Rótulos visíveis na interface — edite à vontade, sem tocar no código.
  rotulos:
    servidor: "Servidor"
    agente: "AGENTE"

# Arranque automático do servidor LM Studio quando a interface abre.
# Requer o CLI 'lms' no PATH (instalado por defeito com versões recentes
# do LM Studio). Se auto_start for false, apenas avisa sem arrancar.
lm_studio:
  auto_start: true
  startup_timeout_seconds: 60
  load_model_on_start: true

mcp_servers:
  - name: git
    command: uvx
    args:
      - mcp-server-git
      - --repository
      - .